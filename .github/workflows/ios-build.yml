name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify message timeline and user isolation
        run: bash Tests/run-business-refresh.sh

      - name: Verify automation server contracts
        if: hashFiles('Tests/run-customer-automation.sh') != ''
        run: bash Tests/run-customer-automation.sh

      - name: Verify ULTRA-SAP voice effects and icon
        run: bash Tests/run-ultra-voice.sh

      - name: Verify ULTRA-SAP media translation and queue contracts
        run: bash Tests/run-ultra-suite.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project WhatsAppBridge.xcodeproj \
            -scheme WhatsAppBridge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
