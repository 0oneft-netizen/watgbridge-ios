name: Workspace Addon Proof of Concept
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test packaging integrity
        run: python3 -m unittest discover -s tools/watusi-workspace-poc/tests -v
      - name: Build preview and addon with Apple SDK
        run: bash tools/watusi-workspace-poc/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Workspace-Addon-PoC
          path: |
            tools/watusi-workspace-poc/out/WorkspacePreview-unsigned.ipa
            tools/watusi-workspace-poc/out/WBGWorkspace.dylib
            tools/watusi-workspace-poc/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
