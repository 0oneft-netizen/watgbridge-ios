name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show uploaded files
        run: |
          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          PROJECT_DIR="$(find . -type d -name WhatsAppBridge -print -quit | xargs dirname)"

          echo "Project directory: $PROJECT_DIR"

          test -d "$PROJECT_DIR/WhatsAppBridge" || {
            echo "ERROR: WhatsAppBridge folder not found"
            exit 1
          }

          test -f "$PROJECT_DIR/project.yml" || {
            echo "ERROR: project.yml not found beside WhatsAppBridge"
            exit 1
          }

          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Build iPhone Simulator
        run: |
          PBX="$(find . -path '*/WhatsAppBridge.xcodeproj/project.pbxproj' -print -quit)"

          test -n "$PBX" || {
            echo "ERROR: generated Xcode project not found"
            exit 1
          }

          PROJECT_DIR="$(dirname "$(dirname "$PBX")")"

          echo "Building: $PROJECT_DIR/WhatsAppBridge.xcodeproj"

          xcodebuild \
            -project "$PROJECT_DIR/WhatsAppBridge.xcodeproj" \
            -scheme WhatsAppBridge \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
