name: iOS IPA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify message timeline and user isolation
        run: bash Tests/run-business-refresh.sh

      - name: Verify automation server contracts
        if: hashFiles('Tests/run-customer-automation.sh') != ''
        run: bash Tests/run-customer-automation.sh

      - name: Verify ULTRA-SAP voice effects and icon
        run: bash Tests/run-ultra-voice.sh

      - name: Verify ULTRA-SAP media translation and queue contracts
        run: bash Tests/run-ultra-suite.sh

      - name: Verify receipt details and WhatsApp blocking contracts
        run: bash Tests/run-contact-upgrade.sh

      - name: Verify complete upgrade isolation and protected media cleanup
        run: bash Tests/run-ultra-complete.sh

      - name: Verify contact card and call voice effects
        run: bash Tests/run-contact-call-repair.sh

      - name: Verify photo export and JFIF handling
        run: bash Tests/run-photo-export.sh

      - name: Verify voice notes, Israeli phone copy and draft isolation
        run: bash Tests/run-professional-upgrade.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          rm -rf build Payload WhatsAppBridge-unsigned.ipa

          xcodebuild \
            -project WhatsAppBridge.xcodeproj \
            -scheme WhatsAppBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            SWIFT_COMPILATION_MODE="singlefile" \
            SWIFT_ENABLE_BATCH_MODE=NO \
            build

      - name: Create unsigned IPA
        run: |
          APP="$(find build -type d -name 'WhatsAppBridge.app' -path '*Release-iphoneos*' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: WhatsAppBridge.app not found"
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload WhatsAppBridge-unsigned.ipa

          ls -lh WhatsAppBridge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppBridge-unsigned-IPA
          path: WhatsAppBridge-unsigned.ipa
          if-no-files-found: error
