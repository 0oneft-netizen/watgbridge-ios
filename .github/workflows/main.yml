name: iOS IPA Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          rm -rf build Payload WhatsAppBridge-unsigned.ipa

          xcodebuild \
            -project WhatsAppBridge.xcodeproj \
            -scheme WhatsAppBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          APP="$(find build -type d -name 'WhatsAppBridge.app' -path '*Release-iphoneos*' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: WhatsAppBridge.app not found"
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload WhatsAppBridge-unsigned.ipa

          ls -lh WhatsAppBridge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppBridge-unsigned-IPA
          path: WhatsAppBridge-unsigned.ipa
          if-no-files-found: error
