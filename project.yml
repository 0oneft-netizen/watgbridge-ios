name: WhatsAppBridge

options:
  bundleIdPrefix: com.watgbridge
  deploymentTarget:
    iOS: "17.0"

targets:
  WhatsAppBridge:
    type: application
    platform: iOS
    sources:
      - WhatsAppBridge

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watgbridge.ios
        PRODUCT_NAME: WhatsAppBridge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhatsAppBridge
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is used to record voice messages."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is used to take photos and videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo access is used to send photos and videos."

    scheme:
      testTargets: []
